<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample HTML Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #24292f;
    }

    .card {
      padding: 1.5rem;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      background: #f6f8fa;
    }

    button {
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 6px;
      background: #0969da;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, world!</h1>
    <p>This sample page demonstrates basic HTML, CSS, and JavaScript.</p>
    <button id="greet-button" type="button">Show greeting</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    document.querySelector("#greet-button").addEventListener("click", () => {
      document.querySelector("#message").textContent = "Thanks for visiting!";
    });
  </script>
</body>
</html>
